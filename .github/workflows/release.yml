name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version used in dry-run artifact names
        required: true
        default: v2.4.1

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          }
          product_version=$(sed -n \
            "s/^[[:space:]]*mooncompiler_version[[:space:]]*=[[:space:]]*'\([^']*\)';/\1/p" \
            compiler/version.pas)
          [[ -n "$product_version" && "$RELEASE_TAG" == "v$product_version" ]] || {
            echo "tag $RELEASE_TAG does not match MoonCompiler $product_version" >&2
            exit 1
          }
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$product_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  qualification-proof:
    needs: validate-tag
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require successful exact-SHA qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
        run: |
          python3 qualification/release/verify_qualification_run.py \
            --repository "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA"

  linux-x86-64:
    needs: [validate-tag, qualification-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bootstrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            make binutils gcc fp-compiler-3.2.2
          test "$(fpc -iV)" = 3.2.2
      - name: Build toolchain
        run: ./build compiler
      - name: Verify toolchain configuration, assembler and RTL profile
        run: |
          python3 qualification/build-driver/config_contract_gate.py
          python3 qualification/build-driver/rtl_profile_gate.py
      - name: Run memory-manager failure contracts
        run: |
          python3 qualification/memory-manager/mm_failure_gate.py \
            --compiler toolchain/bin/ppcx64 \
            --config toolchain/etc/moon-base.cfg \
            --mm runtime/mm/mormot.core.fpcx64mm.pas \
            --out .qualification/release-linux-mm-failure --group all
      - name: Pack toolchain
        run: |
          mkdir -p dist
          asset="mooncompiler-toolchain-${RELEASE_TAG}-linux-x86-64.tar.gz"
          tar -czf "dist/$asset" -C toolchain .
      - name: Smoke-test the archive as a user installs it
        # The archive alone, outside the clone: unpack, clone MoonORMot next
        # to it, build with plain fpc from the program's directory (the Quick
        # Start of README.md).  No driver takes part.
        run: |
          asset="$PWD/dist/mooncompiler-toolchain-${RELEASE_TAG}-linux-x86-64.tar.gz"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/toolchain" "$smoke/app"
          tar -xzf "$asset" -C "$smoke/toolchain"
          git clone --quiet --depth 1 https://github.com/Moonbot-Tech/MoonORMot "$smoke/mormot"
          cp examples/hello.dpr examples/zip.dpr "$smoke/app/"
          cp RTL-test/semantic/file_resource_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/monitor_wait_contract_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/filesystem_unicode_contract_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/classes_text_io_contract_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/text_stream_type_identity_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/url_components_contract_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/iso8601_validation_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/json_navigation_contract_semantic.dpr "$smoke/app/"
          cp RTL-test/semantic/filesystem_operations_contract_semantic.dpr "$smoke/app/"
          cp qualification/suite/tests/rtl-api/rtl_api_release231_contracts.dpr "$smoke/app/"
          cp qualification/suite/tests/smoke/http_error_privacy.dpr "$smoke/app/"
          cp tests/test/units/system/tres4.res "$smoke/app/"
          sed -i 's|{\$R \.\./\.\./tests/test/units/system/tres4\.res}|{$R tres4.res}|' \
            "$smoke/app/file_resource_semantic.dpr"
          grep -q '{\$R tres4\.res}' "$smoke/app/file_resource_semantic.dpr"
          cd "$smoke/app"
          fpc="$smoke/toolchain/bin/fpc"
          for profile in '' -dRELEASE; do
            "$fpc" $profile hello.dpr
            output=$(./hello)
            [[ "$output" == '3 prices, sum = '* ]]
            "$fpc" $profile zip.dpr
            output=$(./zip)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == ZIP_EXAMPLE_OK ]]
            "$fpc" $profile file_resource_semantic.dpr
            output=$(./file_resource_semantic)
            [[ "$output" == FILE_RESOURCE_PASS ]]
            "$fpc" $profile rtl_api_release231_contracts.dpr
            output=$(timeout 30 ./rtl_api_release231_contracts)
            [[ "$output" == RTL_API_RELEASE231_CONTRACTS_OK ]]
            "$fpc" $profile http_error_privacy.dpr
            output=$(timeout 30 ./http_error_privacy)
            [[ "$output" == HTTP_ERROR_PRIVACY_PASS ]]
            "$fpc" $profile monitor_wait_contract_semantic.dpr
            output=$(timeout 10 ./monitor_wait_contract_semantic)
            [[ "$output" == MONITOR_WAIT_CONTRACT_PASS ]]
            "$fpc" $profile filesystem_unicode_contract_semantic.dpr
            output=$(timeout 10 ./filesystem_unicode_contract_semantic)
            [[ "$output" == FILESYSTEM_UNICODE_CONTRACT_PASS ]]
            "$fpc" $profile classes_text_io_contract_semantic.dpr
            output=$(timeout 15 ./classes_text_io_contract_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == CLASSES_TEXT_IO_CONTRACT_PASS ]]
            "$fpc" $profile text_stream_type_identity_semantic.dpr
            output=$(timeout 15 ./text_stream_type_identity_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == TEXT_STREAM_TYPE_IDENTITY_PASS ]]
            "$fpc" $profile url_components_contract_semantic.dpr
            output=$(timeout 15 ./url_components_contract_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == URL_COMPONENTS_CONTRACT_PASS ]]
            "$fpc" $profile iso8601_validation_semantic.dpr
            output=$(timeout 15 ./iso8601_validation_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == ISO8601_VALIDATION_PASS ]]
            "$fpc" $profile json_navigation_contract_semantic.dpr
            output=$(timeout 15 ./json_navigation_contract_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == JSON_NAVIGATION_CONTRACT_PASS ]]
            "$fpc" $profile filesystem_operations_contract_semantic.dpr
            output=$(timeout 15 ./filesystem_operations_contract_semantic)
            [[ "$(printf '%s\n' "$output" | tail -n 1)" == FILESYSTEM_OPERATIONS_CONTRACT_PASS ]]
          done
          test -d units/x86_64-linux/debug
          test -d units/x86_64-linux/release
          python3 "$GITHUB_WORKSPACE/qualification/release/rtl_boundaries_smoke.py" \
            --compiler "$fpc" --out "$smoke/rtl-boundaries"
      - name: Install the archive with the driver
        # ./build toolchain ARCHIVE: the driver's own install path (archive
        # checks, the IDE configuration for this clone, atomic swap), then the
        # contracts over the installed copy.
        run: |
          asset="dist/mooncompiler-toolchain-${RELEASE_TAG}-linux-x86-64.tar.gz"
          mv toolchain toolchain.built
          ./build toolchain "$asset"
          ! grep -q 'toolchain\.new\.' toolchain/etc/moon-base.cfg
          ! grep -q 'toolchain\.new\.' toolchain/etc/fpc.cfg
          test -x toolchain/bin/fpcres
          test -x toolchain/ide/bin/fpcres
          python3 qualification/build-driver/config_contract_gate.py
          python3 qualification/build-driver/product_config_gate.py
          python3 qualification/build-driver/unit_scope_gate.py
          python3 qualification/build-driver/zlib_objects_gate.py
          python3 qualification/build-driver/rtl_profile_gate.py
          python3 qualification/build-driver/version_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-linux-x86-64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  win64-x86-64:
    needs: [validate-tag, qualification-proof]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC 3.2.2 bootstrap
        shell: powershell
        run: |
          .\scripts\Install-FpcBootstrap.ps1 `
            -Destination "$env:RUNNER_TEMP\fpc-3.2.2"
      - name: Build toolchain
        shell: powershell
        run: |
          .\build.ps1 compiler `
            -Bootstrap "$env:RUNNER_TEMP\fpc-3.2.2\bin\i386-win32\fpc.exe"
      - name: Verify toolchain configuration, assembler and RTL profile
        shell: powershell
        run: |
          python .\qualification\build-driver\config_contract_gate.py
          If ($LASTEXITCODE -ne 0) { throw 'Configuration contract failed' }
          python .\qualification\build-driver\rtl_profile_gate.py `
            --make "$env:RUNNER_TEMP\fpc-3.2.2\bin\i386-win32\make.exe"
          If ($LASTEXITCODE -ne 0) { throw 'RTL profile contract failed' }
      - name: Run memory-manager failure contracts
        shell: powershell
        run: |
          python .\qualification\memory-manager\mm_failure_gate.py `
            --compiler .\toolchain\bin\x86_64-win64\ppcx64.exe `
            --config .\toolchain\bin\x86_64-win64\moon-base.cfg `
            --mm .\runtime\mm\mormot.core.fpcx64mm.pas `
            --out .\.qualification\release-win64-mm-failure --group all
          If ($LASTEXITCODE -ne 0) { throw 'MM failure contracts failed' }
      - name: Pack toolchain
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Asset = "mooncompiler-toolchain-$env:RELEASE_TAG-win64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'toolchain').Path,
            (Join-Path (Resolve-Path dist).Path $Asset),
            [IO.Compression.CompressionLevel]::Optimal,
            $false)
      - name: Smoke-test the archive as a user installs it
        # The archive alone, outside the clone: unpack, clone MoonORMot next
        # to it, build with plain fpc from the program's directory (the Quick
        # Start of README.md).  No driver takes part.
        shell: powershell
        run: |
          $Asset = (Resolve-Path "dist\mooncompiler-toolchain-$env:RELEASE_TAG-win64.zip").Path
          $Smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path "$Smoke\app" | Out-Null
          Expand-Archive -LiteralPath $Asset -DestinationPath "$Smoke\toolchain"
          git clone --quiet --depth 1 https://github.com/Moonbot-Tech/MoonORMot "$Smoke\mormot"
          If ($LASTEXITCODE -ne 0) { throw 'MoonORMot clone failed' }
          Copy-Item examples\hello.dpr, examples\zip.dpr, `
            RTL-test\semantic\file_resource_semantic.dpr, `
            RTL-test\semantic\monitor_wait_contract_semantic.dpr, `
            RTL-test\semantic\filesystem_unicode_contract_semantic.dpr, `
            RTL-test\semantic\classes_text_io_contract_semantic.dpr, `
            RTL-test\semantic\text_stream_type_identity_semantic.dpr, `
            RTL-test\semantic\url_components_contract_semantic.dpr, `
            RTL-test\semantic\iso8601_validation_semantic.dpr, `
            RTL-test\semantic\json_navigation_contract_semantic.dpr, `
            RTL-test\semantic\filesystem_operations_contract_semantic.dpr, `
            qualification\suite\tests\rtl-api\rtl_api_release231_contracts.dpr, `
            qualification\suite\tests\smoke\http_error_privacy.dpr, `
            tests\test\units\system\tres4.res "$Smoke\app"
          $Resource = "$Smoke\app\file_resource_semantic.dpr"
          $Text = Get-Content -Raw $Resource
          $Patched = $Text.Replace('{$R ../../tests/test/units/system/tres4.res}', '{$R tres4.res}')
          If ($Patched -eq $Text) { throw 'the resource smoke source no longer names tres4.res as expected' }
          Set-Content -LiteralPath $Resource -Value $Patched -Encoding Ascii -NoNewline
          $Fpc = "$Smoke\toolchain\bin\x86_64-win64\fpc.exe"
          python qualification\release\rtl_boundaries_smoke.py --compiler $Fpc --out "$Smoke\rtl-boundaries"
          If ($LASTEXITCODE -ne 0) { throw 'RTL boundary archive contracts failed' }
          Push-Location "$Smoke\app"
          try {
            foreach ($Profile in @(@(), @('-dRELEASE'))) {
              & $Fpc @Profile hello.dpr
              If ($LASTEXITCODE -ne 0) { throw 'hello did not compile' }
              $Output = & .\hello.exe
              If ($LASTEXITCODE -ne 0 -or $Output -notlike '3 prices, sum = *') {
                throw "hello returned: $Output"
              }
              & $Fpc @Profile zip.dpr
              If ($LASTEXITCODE -ne 0) { throw 'zip did not compile' }
              $Output = @(& .\zip.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'ZIP_EXAMPLE_OK') {
                throw "zip returned: $Output"
              }
              & $Fpc @Profile file_resource_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'the resource smoke did not compile' }
              $Output = & .\file_resource_semantic.exe
              If ($LASTEXITCODE -ne 0 -or $Output -ne 'FILE_RESOURCE_PASS') {
                throw "resource smoke returned: $Output"
              }
              & $Fpc @Profile rtl_api_release231_contracts.dpr
              If ($LASTEXITCODE -ne 0) { throw 'RTL compatibility smoke did not compile' }
              $Output = & .\rtl_api_release231_contracts.exe
              If ($LASTEXITCODE -ne 0 -or $Output -ne 'RTL_API_RELEASE231_CONTRACTS_OK') {
                throw "RTL compatibility smoke returned: $Output"
              }
              & $Fpc @Profile http_error_privacy.dpr
              If ($LASTEXITCODE -ne 0) { throw 'HTTP privacy smoke did not compile' }
              $Output = & .\http_error_privacy.exe
              If ($LASTEXITCODE -ne 0 -or $Output -ne 'HTTP_ERROR_PRIVACY_PASS') {
                throw "HTTP privacy smoke returned: $Output"
              }
              & $Fpc @Profile monitor_wait_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'monitor wait smoke did not compile' }
              $Output = & .\monitor_wait_contract_semantic.exe
              If ($LASTEXITCODE -ne 0 -or $Output -ne 'MONITOR_WAIT_CONTRACT_PASS') {
                throw "monitor wait smoke returned: $Output"
              }
              & $Fpc @Profile filesystem_unicode_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'Unicode filesystem smoke did not compile' }
              $Output = & .\filesystem_unicode_contract_semantic.exe
              If ($LASTEXITCODE -ne 0 -or $Output -ne 'FILESYSTEM_UNICODE_CONTRACT_PASS') {
                throw "Unicode filesystem smoke returned: $Output"
              }
              & $Fpc @Profile classes_text_io_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'classes_text_io_contract_semantic did not compile' }
              $Output = @(& .\classes_text_io_contract_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'CLASSES_TEXT_IO_CONTRACT_PASS') {
                throw "classes_text_io_contract_semantic returned: $Output"
              }
              & $Fpc @Profile text_stream_type_identity_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'text_stream_type_identity_semantic did not compile' }
              $Output = @(& .\text_stream_type_identity_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'TEXT_STREAM_TYPE_IDENTITY_PASS') {
                throw "text_stream_type_identity_semantic returned: $Output"
              }
              & $Fpc @Profile url_components_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'url_components_contract_semantic did not compile' }
              $Output = @(& .\url_components_contract_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'URL_COMPONENTS_CONTRACT_PASS') {
                throw "url_components_contract_semantic returned: $Output"
              }
              & $Fpc @Profile iso8601_validation_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'iso8601_validation_semantic did not compile' }
              $Output = @(& .\iso8601_validation_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'ISO8601_VALIDATION_PASS') {
                throw "iso8601_validation_semantic returned: $Output"
              }
              & $Fpc @Profile json_navigation_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'json_navigation_contract_semantic did not compile' }
              $Output = @(& .\json_navigation_contract_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'JSON_NAVIGATION_CONTRACT_PASS') {
                throw "json_navigation_contract_semantic returned: $Output"
              }
              & $Fpc @Profile filesystem_operations_contract_semantic.dpr
              If ($LASTEXITCODE -ne 0) { throw 'filesystem_operations_contract_semantic did not compile' }
              $Output = @(& .\filesystem_operations_contract_semantic.exe)
              If ($LASTEXITCODE -ne 0 -or $Output[-1] -ne 'FILESYSTEM_OPERATIONS_CONTRACT_PASS') {
                throw "filesystem_operations_contract_semantic returned: $Output"
              }
            }
            If (-not (Test-Path units\x86_64-win64\debug) -or
                -not (Test-Path units\x86_64-win64\release)) {
              throw 'the profile unit directories are missing'
            }
          } finally {
            Pop-Location
          }
      - name: Install the archive with the driver
        # .\build.ps1 toolchain ARCHIVE: the driver's own install path
        # (archive checks, atomic swap), then the contracts over the installed
        # copy.
        shell: powershell
        run: |
          $Asset = "dist\mooncompiler-toolchain-$env:RELEASE_TAG-win64.zip"
          Move-Item toolchain toolchain.built
          .\build.ps1 toolchain $Asset
          If (Select-String -Quiet -Pattern 'toolchain\.new\.' `
              -Path toolchain\bin\x86_64-win64\moon-base.cfg,
                    toolchain\bin\x86_64-win64\fpc.cfg) {
            throw 'installed configs still reference the staging path'
          }
          If (-not (Test-Path toolchain\bin\x86_64-win64\fpcres.exe) -or
              -not (Test-Path toolchain\ide\bin\x86_64-win64\fpcres.exe)) {
            throw 'the archive does not contain the resource compiler'
          }
          python .\qualification\build-driver\config_contract_gate.py
          If ($LASTEXITCODE -ne 0) { throw 'Installed configuration contract failed' }
          python .\qualification\build-driver\product_config_gate.py
          If ($LASTEXITCODE -ne 0) { throw 'Installed product configuration gate failed' }
          python .\qualification\build-driver\unit_scope_gate.py
          If ($LASTEXITCODE -ne 0) { throw 'Installed unit scope gate failed' }
          python .\qualification\build-driver\zlib_objects_gate.py
          If ($LASTEXITCODE -ne 0) { throw 'Installed zlib objects gate failed' }
          python .\qualification\build-driver\rtl_profile_gate.py `
            --make "$env:RUNNER_TEMP\fpc-3.2.2\bin\i386-win32\make.exe"
          If ($LASTEXITCODE -ne 0) { throw 'Installed RTL profile contract failed' }
          python .\qualification\build-driver\version_contract.py
          If ($LASTEXITCODE -ne 0) { throw 'Installed version contract failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-win64-x86-64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate-tag, qualification-proof, linux-x86-64, win64-x86-64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: toolchain-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum mooncompiler-toolchain-* > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urljoin
          version = os.environ['RELEASE_VERSION']
          base = f"https://github.com/{os.environ['GH_REPO']}/blob/{os.environ['RELEASE_TAG']}/"
          notes = Path('doc/RELEASE_NOTES.md').read_text(encoding='utf-8').split('\n---\n', 1)[0].strip()
          if not notes.startswith(f'# MoonCompiler {version}:'):
              raise SystemExit('Release notes do not match the release version')
          notes = re.sub(r'(?<=\]\()(?!https?://|#)([^)]+)',
                         lambda match: urljoin(base + 'doc/', match[0]), notes)
          notes += f'\n\nDownload the archive for your platform and follow the [Quick Start]({base}README.md#quick-start). SHA256SUMS and GitHub artifact attestations accompany the binaries.\n'
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
          release_options=(
            "$RELEASE_TAG"
            dist/mooncompiler-toolchain-*
            dist/SHA256SUMS
            --verify-tag
            --title "MoonCompiler $RELEASE_VERSION"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          [[ "$RELEASE_TAG" != *-* ]] || release_options+=(--prerelease)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/mooncompiler-toolchain-* dist/SHA256SUMS --clobber
          else
            gh release create "${release_options[@]}"
          fi
